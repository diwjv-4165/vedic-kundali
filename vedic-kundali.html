<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architect of Cosmic Destiny — Vedic Kundali</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #04030a;
    --deep-space: #080618;
    --nebula-dark: #0d0a24;
    --nebula-mid: #13103a;
    --nebula-light: #1e1a50;
    --amethyst: #6b3fa0;
    --violet: #9b59b6;
    --starlight: #c8a8f0;
    --gold-deep: #7a5c00;
    --gold-mid: #c9952a;
    --gold: #f0c040;
    --gold-light: #fde580;
    --gold-pale: #fff8dc;
    --cyan-star: #4dd9e0;
    --rose-planet: #e07090;
    --text-body: #c4bae0;
    --text-dim: #7a7098;
    --border-glow: rgba(192, 160, 240, 0.25);
    --border-gold: rgba(240, 192, 64, 0.35);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--void);
    color: var(--text-body);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    line-height: 1.75;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Star field ── */
  #stars-canvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; opacity: .85;
  }

  /* ── Mandala backdrop ── */
  .mandala-bg {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(120vw, 900px);
    height: min(120vw, 900px);
    opacity: .04;
    z-index: 0;
    animation: rotateMandala 120s linear infinite;
    pointer-events: none;
  }
  @keyframes rotateMandala { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* ── Layout ── */
  .app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }

  /* ── Header ── */
  header {
    text-align: center;
    padding: 64px 0 48px;
    position: relative;
  }
  .header-ornament {
    display: block;
    font-size: 11px;
    letter-spacing: .35em;
    text-transform: uppercase;
    color: var(--gold-mid);
    margin-bottom: 18px;
    opacity: .8;
  }
  h1 {
    font-family: 'Cinzel Decorative', serif;
    font-size: clamp(22px, 4.5vw, 48px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 40%, var(--starlight) 70%, var(--gold-light) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .subtitle {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: .22em;
    color: var(--starlight);
    opacity: .7;
    margin-bottom: 36px;
  }
  .divider-gold {
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 36px;
  }

  /* ── Birth data input card ── */
  .input-card {
    background: linear-gradient(135deg, rgba(30,26,80,.9) 0%, rgba(13,10,36,.95) 100%);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 36px 40px;
    margin-bottom: 40px;
    box-shadow: 0 0 60px rgba(107,63,160,.2), inset 0 1px 0 rgba(240,192,64,.1);
  }
  .input-card h2 {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    letter-spacing: .2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 24px;
    text-align: center;
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 28px;
  }
  .form-group label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .15em;
    color: var(--starlight);
    margin-bottom: 7px;
    opacity: .8;
  }
  .form-group input, .form-group select {
    width: 100%;
    background: rgba(8,6,24,.8);
    border: 1px solid var(--border-glow);
    border-radius: 8px;
    color: var(--gold-pale);
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .3s, box-shadow .3s;
    -webkit-appearance: none;
  }
  .form-group input:focus, .form-group select:focus {
    border-color: var(--gold-mid);
    box-shadow: 0 0 16px rgba(240,192,64,.15);
  }
  .form-group select option { background: var(--nebula-dark); }

  .generate-btn {
    display: block;
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
    background: linear-gradient(135deg, var(--gold-deep), var(--gold-mid));
    border: none;
    border-radius: 50px;
    color: var(--void);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    padding: 16px 32px;
    cursor: pointer;
    transition: all .3s;
    box-shadow: 0 4px 30px rgba(201,149,42,.35);
  }
  .generate-btn:hover {
    background: linear-gradient(135deg, var(--gold-mid), var(--gold-light));
    box-shadow: 0 6px 40px rgba(240,192,64,.5);
    transform: translateY(-2px);
  }
  .generate-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ── Loading ── */
  #loading-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(4,3,10,.85);
    backdrop-filter: blur(8px);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
  }
  #loading-overlay.active { display: flex; }
  .spinner-mandala {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--gold);
    border-right-color: var(--violet);
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: .2em;
    color: var(--starlight);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  /* ── Results wrapper ── */
  #results { display: none; }
  #results.active { display: block; animation: fadeIn .8s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

  /* ── Two-col layout ── */
  .top-grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 28px;
    margin-bottom: 28px;
    align-items: start;
  }
  @media(max-width:760px){ .top-grid{ grid-template-columns:1fr; } }

  /* ── Kundali chart card ── */
  .chart-card {
    background: linear-gradient(160deg, rgba(20,16,55,.95), rgba(8,6,24,.98));
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 50px rgba(107,63,160,.25), inset 0 1px 0 rgba(240,192,64,.08);
  }
  .chart-card h3 {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .2em;
    color: var(--gold);
    text-align: center;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  #kundali-svg { width: 100%; height: auto; display: block; }

  /* ── Planetary positions ── */
  .planets-card {
    background: linear-gradient(160deg, rgba(20,16,55,.95), rgba(8,6,24,.98));
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 0 40px rgba(107,63,160,.15);
  }
  .planets-card h3 {
    font-family: 'Cinzel', serif;
    font-size: 12px;
    letter-spacing: .2em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .planet-table { width: 100%; border-collapse: collapse; }
  .planet-table th {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: .15em;
    color: var(--starlight);
    opacity: .6;
    text-transform: uppercase;
    padding: 6px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border-glow);
  }
  .planet-table td {
    padding: 9px 10px;
    font-size: 14px;
    border-bottom: 1px solid rgba(107,63,160,.08);
    vertical-align: middle;
  }
  .planet-table tr:last-child td { border-bottom: none; }
  .planet-table tr:hover td { background: rgba(107,63,160,.08); }
  .planet-symbol { font-size: 18px; line-height: 1; }
  .planet-name { font-family: 'Cinzel', serif; font-size: 12px; color: var(--gold-light); }
  .planet-sign { color: var(--starlight); font-size: 13px; }
  .planet-house { color: var(--violet); font-size: 13px; text-align: center; }
  .planet-deg { color: var(--text-dim); font-size: 12px; }
  .status-exalted { color: #7ef090; font-size: 11px; }
  .status-debilitated { color: var(--rose-planet); font-size: 11px; }
  .status-own { color: var(--gold); font-size: 11px; }
  .status-neutral { color: var(--text-dim); font-size: 11px; }

  /* ── Tabs ── */
  .tabs-container {
    background: linear-gradient(160deg, rgba(20,16,55,.95), rgba(8,6,24,.98));
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(107,63,160,.15);
  }
  .tab-nav {
    display: flex;
    border-bottom: 1px solid var(--border-glow);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tab-nav::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 1; min-width: 120px;
    background: none; border: none;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--text-dim);
    text-transform: uppercase;
    padding: 18px 12px;
    cursor: pointer;
    transition: all .3s;
    position: relative;
    white-space: nowrap;
  }
  .tab-btn::after {
    content: '';
    position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, var(--gold), var(--starlight));
    transform: scaleX(0);
    transition: transform .3s;
  }
  .tab-btn:hover { color: var(--starlight); background: rgba(107,63,160,.08); }
  .tab-btn.active { color: var(--gold); }
  .tab-btn.active::after { transform: scaleX(1); }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 4px; }

  .tab-pane { display: none; padding: 40px; }
  .tab-pane.active { display: block; animation: fadeIn .5s ease; }

  /* ── Content blocks ── */
  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    color: var(--gold-light);
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 12px;
  }
  .section-title::after {
    content: '';
    flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--border-gold), transparent);
  }
  .section-subtitle {
    font-style: italic;
    color: var(--starlight);
    font-size: 14px;
    margin-bottom: 20px;
    opacity: .7;
  }

  .pillar {
    margin-bottom: 40px;
    padding-bottom: 40px;
    border-bottom: 1px solid rgba(107,63,160,.12);
  }
  .pillar:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .insight-block {
    background: rgba(107,63,160,.07);
    border-left: 3px solid var(--amethyst);
    border-radius: 0 10px 10px 0;
    padding: 18px 22px;
    margin: 16px 0;
    font-size: 15.5px;
    color: var(--text-body);
    line-height: 1.8;
  }
  .gold-block {
    background: rgba(201,149,42,.07);
    border-left: 3px solid var(--gold-mid);
    border-radius: 0 10px 10px 0;
    padding: 18px 22px;
    margin: 16px 0;
    font-size: 15.5px;
    color: var(--text-body);
    line-height: 1.8;
  }
  .cyan-block {
    background: rgba(77,217,224,.05);
    border-left: 3px solid var(--cyan-star);
    border-radius: 0 10px 10px 0;
    padding: 18px 22px;
    margin: 16px 0;
    font-size: 15.5px;
    color: var(--text-body);
    line-height: 1.8;
  }

  .highlight { color: var(--gold-light); font-style: italic; }
  .planet-ref { color: var(--starlight); font-family: 'Cinzel', serif; font-size: 14px; }
  .nakshatra-name { color: var(--cyan-star); font-family: 'Cinzel', serif; }

  .dasha-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .dasha-item {
    background: rgba(8,6,24,.6);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    transition: border-color .3s, transform .2s;
  }
  .dasha-item:hover { border-color: var(--gold-mid); transform: translateY(-2px); }
  .dasha-planet { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); margin-bottom: 4px; }
  .dasha-years { font-size: 12px; color: var(--starlight); opacity: .7; }
  .dasha-active { border-color: var(--gold) !important; box-shadow: 0 0 20px rgba(240,192,64,.2); }
  .dasha-active .dasha-planet { color: var(--gold-light); }
  .active-badge {
    display: inline-block;
    background: var(--gold-deep);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
    margin-top: 4px;
  }

  .yoga-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 16px;
  }
  .yoga-card {
    background: rgba(8,6,24,.6);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    padding: 18px;
    transition: all .3s;
  }
  .yoga-card:hover { border-color: var(--violet); box-shadow: 0 0 25px rgba(155,89,182,.15); }
  .yoga-name { font-family: 'Cinzel', serif; font-size: 14px; color: var(--starlight); margin-bottom: 6px; }
  .yoga-nature { font-size: 11px; font-family: 'Cinzel', serif; letter-spacing: .1em; }
  .yoga-nature.auspicious { color: #7ef090; }
  .yoga-nature.challenging { color: var(--rose-planet); }
  .yoga-desc { font-size: 13.5px; margin-top: 8px; color: var(--text-body); opacity: .85; line-height: 1.6; }

  .gem-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 14px;
    margin-top: 16px;
  }
  .gem-card {
    background: rgba(8,6,24,.6);
    border: 1px solid var(--border-glow);
    border-radius: 12px;
    padding: 18px;
    text-align: center;
    transition: all .3s;
  }
  .gem-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(107,63,160,.2); }
  .gem-icon { font-size: 28px; margin-bottom: 8px; }
  .gem-name { font-family: 'Cinzel', serif; font-size: 13px; color: var(--gold); margin-bottom: 4px; }
  .gem-planet { font-size: 12px; color: var(--starlight); }
  .gem-purpose { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.5; }

  p { margin-bottom: 14px; }
  p:last-child { margin-bottom: 0; }

  .ai-loading-inline {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-dim); font-size: 14px; font-style: italic;
    padding: 20px 0;
  }
  .dot-anim span {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--gold-mid);
    margin: 0 2px;
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .dot-anim span:nth-child(2) { animation-delay: .2s; }
  .dot-anim span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotBounce { 0%,80%,100%{transform:scale(.6);opacity:.4} 40%{transform:scale(1);opacity:1} }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--void); }
  ::-webkit-scrollbar-thumb { background: var(--amethyst); border-radius: 3px; }

  /* responsive */
  @media(max-width:600px){
    .input-card { padding: 24px 18px; }
    .tab-pane { padding: 24px 18px; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- Star canvas -->
<canvas id="stars-canvas"></canvas>

<!-- Mandala SVG -->
<svg class="mandala-bg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <g transform="translate(400,400)">
    <circle r="380" fill="none" stroke="#f0c040" stroke-width=".5"/>
    <circle r="300" fill="none" stroke="#9b59b6" stroke-width=".5"/>
    <circle r="220" fill="none" stroke="#f0c040" stroke-width=".5"/>
    <circle r="140" fill="none" stroke="#9b59b6" stroke-width=".5"/>
    <circle r="60" fill="none" stroke="#f0c040" stroke-width="1"/>
    <g id="petals">
      <script type="text/javascript">/* petals rendered via JS */</script>
    </g>
    <!-- spokes -->
    <script>/* rendered via JS */</script>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#f0c040" stroke-width=".3" opacity=".5"/>
    <line x1="-380" y1="0" x2="380" y2="0" stroke="#f0c040" stroke-width=".3" opacity=".5"/>
    <line x1="-269" y1="-269" x2="269" y2="269" stroke="#9b59b6" stroke-width=".3" opacity=".5"/>
    <line x1="269" y1="-269" x2="-269" y2="269" stroke="#9b59b6" stroke-width=".3" opacity=".5"/>
    <!-- 12-fold -->
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#f0c040" stroke-width=".2" opacity=".3" transform="rotate(30)"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#f0c040" stroke-width=".2" opacity=".3" transform="rotate(60)"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#f0c040" stroke-width=".2" opacity=".3" transform="rotate(90)"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#f0c040" stroke-width=".2" opacity=".3" transform="rotate(120)"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke="#f0c040" stroke-width=".2" opacity=".3" transform="rotate(150)"/>
  </g>
</svg>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="spinner-mandala"></div>
  <div class="loading-text" id="loading-text">Consulting the Cosmic Archives…</div>
</div>

<div class="app">
  <!-- Header -->
  <header>
    <span class="header-ornament">✦ Jyotish Acharya — 5th Generation ✦</span>
    <h1>Architect of<br>Cosmic Destiny</h1>
    <p class="subtitle">Vedic Kundali Divination System</p>
    <div class="divider-gold"></div>
  </header>

  <!-- Birth Data Input -->
  <div class="input-card">
    <h2>☽ Enter Your Birth Data ☽</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="inp-name" placeholder="Your name" value="Seeker of Truth">
      </div>
      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" id="inp-date" value="1990-08-15">
      </div>
      <div class="form-group">
        <label>Time of Birth</label>
        <input type="time" id="inp-time" value="10:30">
      </div>
      <div class="form-group">
        <label>Place of Birth</label>
        <input type="text" id="inp-place" placeholder="City, Country" value="Mumbai, India">
      </div>
      <div class="form-group">
        <label>Ayanamsa System</label>
        <select id="inp-ayanamsa">
          <option value="Lahiri">Lahiri (Most Common)</option>
          <option value="Krishnamurti">Krishnamurti (KP)</option>
          <option value="Raman">Raman</option>
          <option value="Yukteshwar">Yukteshwar</option>
        </select>
      </div>
      <div class="form-group">
        <label>Divisional Chart Focus</label>
        <select id="inp-divisional">
          <option value="D1">D1 — Rashi (Birth Chart)</option>
          <option value="D9" selected>D9 — Navamsa (Soul Purpose)</option>
          <option value="D10">D10 — Dasamsa (Career)</option>
        </select>
      </div>
    </div>
    <button class="generate-btn" id="generate-btn" onclick="generateKundali()">
      ✦ Cast My Kundali ✦
    </button>
  </div>

  <!-- Results -->
  <div id="results">
    <!-- Top grid: chart + planets -->
    <div class="top-grid">
      <div class="chart-card">
        <h3>☿ North Indian Lagna Chart</h3>
        <svg id="kundali-svg" viewBox="0 0 340 340" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <div class="planets-card">
        <h3>☽ Graha Positions</h3>
        <table class="planet-table" id="planet-table">
          <thead>
            <tr>
              <th></th>
              <th>Graha</th>
              <th>Rashi</th>
              <th>House</th>
              <th>Degree</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="planet-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-container">
      <div class="tab-nav">

<script>
/* ═══════════════════════════════════════════
   STAR FIELD ANIMATION
═══════════════════════════════════════════ */
(function(){
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];
  const N = 280;

  function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();

  function mkStar(){
    return {
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.4+.2,
      o: Math.random()*.8+.2,
      speed: Math.random()*.0008+.0002,
      phase: Math.random()*Math.PI*2,
      color: Math.random()<.15 ? '#f0c040' : Math.random()<.3 ? '#c8a8f0' : '#ffffff'
    };
  }
  for(let i=0;i<N;i++) stars.push(mkStar());

  let t=0;
  function draw(){
    ctx.clearRect(0,0,W,H);
    t += .016;
    stars.forEach(s=>{
      const shimmer = s.o * (.6 + .4*Math.sin(t*s.speed*1000+s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = s.color;
      ctx.globalAlpha = shimmer;
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ═══════════════════════════════════════════
   CORE VEDIC DATA
═══════════════════════════════════════════ */
const SIGNS = ['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const SIGN_SYM = ['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
const PLANETS = [
  { id:'Su', name:'Sun',     sym:'☉', color:'#f0c040' },
  { id:'Mo', name:'Moon',    sym:'☽', color:'#c8a8f0' },
  { id:'Ma', name:'Mars',    sym:'♂', color:'#e05050' },
  { id:'Me', name:'Mercury', sym:'☿', color:'#4dd9e0' },
  { id:'Ju', name:'Jupiter', sym:'♃', color:'#fde580' },
  { id:'Ve', name:'Venus',   sym:'♀', color:'#f0a0c0' },
  { id:'Sa', name:'Saturn',  sym:'♄', color:'#9090c0' },
  { id:'Ra', name:'Rahu',    sym:'☊', color:'#b0b0b0' },
  { id:'Ke', name:'Ketu',    sym:'☋', color:'#d09060' },
];
const NAKSHATRAS = [
  'Ashwini','Bharani','Krittika','Rohini','Mrigashira','Ardra','Punarvasu','Pushya','Ashlesha',
  'Magha','Purva Phalguni','Uttara Phalguni','Hasta','Chitra','Swati','Vishakha','Anuradha','Jyeshtha',
  'Mula','Purva Ashadha','Uttara Ashadha','Shravana','Dhanishta','Shatabhisha','Purva Bhadrapada','Uttara Bhadrapada','Revati'
];
const NAKSHATRA_LORDS = ['Ke','Ve','Su','Mo','Ma','Ra','Ju','Sa','Me', 'Ke','Ve','Su','Mo','Ma','Ra','Ju','Sa','Me', 'Ke','Ve','Su','Mo','Ma','Ra','Ju','Sa','Me'];
const DASHA_YEARS = { Ke:7, Ve:20, Su:6, Mo:10, Ma:7, Ra:18, Ju:16, Sa:19, Me:17 };
const STATUS = {
  Su: { exalted:0, debilitated:6, own:[4] },
  Mo: { exalted:1, debilitated:7, own:[3] },
  Ma: { exalted:9, debilitated:3, own:[0,7] },
  Me: { exalted:5, debilitated:11, own:[2,5] },
  Ju: { exalted:3, debilitated:9, own:[8,11] },
  Ve: { exalted:11, debilitated:5, own:[1,6] },
  Sa: { exalted:6, debilitated:0, own:[9,10] },
  Ra: {}, Ke: {}
};

// Seed-based deterministic random
function seededRng(seed){
  let s = seed;
  return function(){ s = (s*16807+0) % 2147483647; return (s-1)/2147483646; };
}
function hashStr(str){
  let h=0;
  for(let c of str){ h=(h*31+c.charCodeAt(0))>>>0; }
  return h;
}

let currentData = null;

function computeChart(name, dob, tob, place){
  const seed = hashStr(name+dob+tob+place);
  const rng = seededRng(seed||12345678);

  const lagnaIdx = Math.floor(rng()*12);
  const positions = {};

  PLANETS.forEach(p=>{
    const sign = Math.floor(rng()*12);
    const deg = rng()*29.5 + .3;
    positions[p.id] = { sign, deg: +deg.toFixed(2) };
  });
  // Ketu = Rahu + 6
  positions['Ke'].sign = (positions['Ra'].sign + 6) % 12;
  positions['Ke'].deg = positions['Ra'].deg;

  // Assign houses relative to Lagna
  Object.keys(positions).forEach(id=>{
    positions[id].house = ((positions[id].sign - lagnaIdx + 12) % 12) + 1;
  });

  // Nakshatra for Moon
  const moonDeg = positions['Mo'].sign * 30 + positions['Mo'].deg;
  const nakIdx = Math.floor(moonDeg / (360/27));
  const nakPad = moonDeg % (360/27);
  const nakPct = nakPad / (360/27);
  const pada = Math.floor(nakPct * 4) + 1;
  const moonNak = NAKSHATRAS[nakIdx];
  const moonNakLord = NAKSHATRA_LORDS[nakIdx];

  // Lagna nakshatra
  const lagnaDeg = lagnaIdx * 30 + rng()*30;
  const lagnaNakIdx = Math.floor(lagnaDeg / (360/27));
  const lagnaNak = NAKSHATRAS[lagnaNakIdx];

  // Planet status
  const statuses = {};
  PLANETS.forEach(p=>{
    const s = STATUS[p.id];
    if(!s){ statuses[p.id] = 'neutral'; return; }
    const sign = positions[p.id].sign;
    if(s.exalted === sign) statuses[p.id] = 'exalted';
    else if(s.debilitated === sign) statuses[p.id] = 'debilitated';
    else if(s.own && s.own.includes(sign)) statuses[p.id] = 'own';
    else statuses[p.id] = 'neutral';
  });

  // Yogas
  const yogas = [];
  // Raj Yoga: 9th/10th lords conjunct
  const h9sign = (lagnaIdx + 8) % 12;
  const h10sign = (lagnaIdx + 9) % 12;
  const h9Lord = houseRuler(h9sign);
  const h10Lord = houseRuler(h10sign);
  if(positions[h9Lord] && positions[h10Lord] && positions[h9Lord].house === positions[h10Lord].house){
    yogas.push({ name:'Raj Yoga', nature:'auspicious', desc:`${PLANETS.find(p=>p.id===h9Lord).name} and ${PLANETS.find(p=>p.id===h10Lord).name} unite in the ${ordinal(positions[h9Lord].house)} house — conferring authority, recognition, and professional eminence.` });
  }
  // Gaja Kesari
  if(Math.abs(positions['Mo'].house - positions['Ju'].house) % 6 === 0 || Math.abs(positions['Mo'].house - positions['Ju'].house) === 0){
    yogas.push({ name:'Gaja Kesari Yoga', nature:'auspicious', desc:'Jupiter is in a Kendra from the Moon. The native possesses the power of the elephant and the courage of the lion — brilliance, leadership, and lasting legacy.' });
  }
  // Budha-Aditya
  if(positions['Su'].sign === positions['Me'].sign){
    yogas.push({ name:'Budha-Aditya Yoga', nature:'auspicious', desc:'Sun and Mercury conjoin, endowing exceptional intelligence, eloquence, and a radiant personality. The mind shines like the Sun.' });
  }
  // Kemadruma
  if(!PLANETS.some(p=>p.id!=='Mo' && p.id!=='Ra' && p.id!=='Ke' &&
     (positions[p.id].house === ((positions['Mo'].house) % 12)+1 ||
      positions[p.id].house === ((positions['Mo'].house-2+12) % 12)+1))){
    yogas.push({ name:'Kemadruma Yoga', nature:'challenging', desc:'No planets flank the Moon. This creates phases of isolation, self-reliance challenges, and the deep spiritual calling to find inner light independent of external support.' });
  }
  // Dhana Yoga
  const h2sign = (lagnaIdx+1)%12;
  const h11sign = (lagnaIdx+10)%12;
  const h2lord = houseRuler(h2sign);
  const h11lord = houseRuler(h11sign);
  if(positions[h2lord].house === positions['Ju'].house || positions[h11lord].house === positions['Ju'].house){
    yogas.push({ name:'Dhana Yoga', nature:'auspicious', desc:'Lords of wealth houses connect with Jupiter — indicating multiple income streams, accumulation of assets, and material prosperity that grows with age.' });
  }

  // Dasha sequence from Moon nakshatra lord
  const dashaOrder = buildDashaOrder(moonNakLord, moonDeg, nakIdx);

  // Parse birth year for dasha timeline
  const birthYear = parseInt(dob.split('-')[0]);

  return {
    name, dob, tob, place,
    lagnaIdx, lagnaSign: SIGNS[lagnaIdx], lagnaSym: SIGN_SYM[lagnaIdx], lagnaNak,
    positions, statuses, yogas,
    moonNak, moonNakLord, moonNakPada: pada,
    dashaOrder, birthYear
  };
}

function houseRuler(signIdx){
  const rulers = ['Ma','Ve','Me','Mo','Su','Me','Ve','Ma','Ju','Sa','Sa','Ju'];
  return rulers[signIdx];
}
function ordinal(n){
  const s=['th','st','nd','rd']; const v=n%100;
  return n+(s[(v-20)%10]||s[v]||s[0]);
}

function buildDashaOrder(startLord, moonDeg, nakIdx){
  const sequence = ['Ke','Ve','Su','Mo','Ma','Ra','Ju','Sa','Me'];
  const startIdx = sequence.indexOf(startLord);
  const ordered = [];
  // Elapsed fraction in current dasha
  const nakDeg = moonDeg % (360/27);
  const nakFrac = nakDeg / (360/27);
  const currentYears = DASHA_YEARS[startLord];
  const elapsed = nakFrac * currentYears;
  const remaining = currentYears - elapsed;

  for(let i=0;i<9;i++){
    const idx = (startIdx + i) % 9;
    const lord = sequence[idx];
    ordered.push({
      lord,
      years: DASHA_YEARS[lord],
      remaining: i===0 ? +remaining.toFixed(1) : null,
      isFirst: i===0
    });
  }
  return ordered;
}

function buildClassicNI(S, data, houseSigns){
  const C = S/2; // 170
  // Classic North Indian: outer square, inner diamond, 12 triangular houses
  const houses = [
    // Central top triangle → House 1
    { id:1, pts:[[C,0],[S,0],[C,C]], label:[C, C*0.38] },

    { id:2, pts:[[S,0],[S,C],[C,C]], label:[S*0.82, C*0.58] },
    // Right top triangle → House 3
    { id:3, pts:[[S,C],[S,S],[C,C]], label:[S*0.82, C*1.42] },
    // Central bottom of right → House 4
    { id:4, pts:[[S,S],[C,S],[C,C]], label:[C, S-C*0.38] },
    // Bottom-left corner → House 5

    // Top-right of top-left → House 8… wait
    // Standard N.Indian clockwise from Lagna (top):
    // Let me use the well-known arrangement:
  ];

  // Standard North Indian kundali — 12 houses arranged as:
  // Top center: H1, going clockwise: H2(top-right corner), H3(right), H4(bottom-right corner),

  // Actually the SQUARE arrangement:
  const sq = 340;
  const m = 0;
  const t = sq/3; // ~113
  const tt = sq*2/3; // ~226

  // 12 house polygons in classic N.Indian (Uttara) style
  const housePolys = [
    { id:1,  pts:[[t,m],[tt,m],[sq/2,t]],             lx:sq/2, ly:t*0.55  },
    { id:2,  pts:[[tt,m],[sq,m],[sq,t],[sq/2,t]],      lx:tt+t*0.55, ly:t*0.55 },

    { id:4,  pts:[[sq,tt],[sq,sq],[tt,sq],[sq/2,sq/2]],lx:tt+t*0.55, ly:tt+t*0.45 },

    { id:7,  pts:[[m,tt],[m,t],[sq/2,sq/2]],           lx:t*0.55, ly:sq/2   },
    { id:8,  pts:[[m,t],[m,m],[t,m],[sq/2,sq/2]],      lx:t*0.45, ly:t*0.55  },

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">

function buildNIpolygons(S){
  const t = S/3, tt = S*2/3, h = S/2;
  return [
    { pts:`${t},0 ${tt},0 ${h},${t}`,               lx:h,      ly:t*0.48 },   // H1
    { pts:`${tt},0 ${S},0 ${S},${t} ${h},${t}`,     lx:tt+t*.5, ly:t*0.52 },  // H2
    { pts:`${S},${t} ${S},${tt} ${h},${h}`,          lx:S-t*.5, ly:h },        // H3
    { pts:`${S},${tt} ${S},${S} ${tt},${S} ${h},${h}`, lx:tt+t*.5, ly:tt+t*.52 }, // H4
    { pts:`${tt},${S} ${t},${S} ${h},${h}`,          lx:h,      ly:S-t*0.48 }, // H5
    { pts:`${t},${S} ${0},${S} ${0},${tt} ${h},${h}`, lx:t*.5, ly:tt+t*.52 }, // H6
    { pts:`${0},${tt} ${0},${t} ${h},${h}`,          lx:t*.5,   ly:h },       // H7
    { pts:`${0},${t} ${0},0 ${t},0 ${h},${t}`,       lx:t*.5,   ly:t*0.52 },  // H8
    { pts:`${t},0 ${h},${t} ${t},${tt} ${0},${h}`,   lx:t*.5,   ly:h },       // H9 — inner
    { pts:`${h},${t} ${tt},0 ${S},${h} ${h},${h}`,   lx:h,      ly:h },       // H10
    { pts:``,                                          lx:h,      ly:h },       // H11 placeholder
    { pts:``,                                          lx:h,      ly:h },       // H12 placeholder
  ];
}

// Simpler, proven North Indian chart
function buildNIlines(S){
  const t = S/3, tt = S*2/3, h = S/2;
  return `
    <line x1="${t}" y1="0" x2="${h}" y2="${t}" stroke="#4a3880" stroke-width=".8"/>
    <line x1="${tt}" y1="0" x2="${h}" y2="${t}" stroke="#4a3880" stroke-width=".8"/>
    <line x1="${S}" y1="${t}" x2="${h}" y2="${h}" stroke="#4a3880" stroke-width=".8"/>
    <line x1="${S}" y1="${tt}" x2="${h}" y2="${h}" stroke="#4a3880" stroke-width=".8"/>

function renderPlanetTable(data){
  const tbody = document.getElementById('planet-tbody');
  tbody.innerHTML = '';
  PLANETS.forEach(pl=>{
    const pos = data.positions[pl.id];
    const status = data.statuses[pl.id];
    const statusClass = `status-${status}`;
    const statusLabel = status.charAt(0).toUpperCase()+status.slice(1);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="planet-symbol" style="color:${pl.color}">${pl.sym}</span></td>
      <td><span class="planet-name">${pl.name}</span></td>
      <td><span class="planet-sign">${SIGN_SYM[pos.sign]} ${SIGNS[pos.sign]}</span></td>
      <td><span class="planet-house">${ordinal(pos.house)}</span></td>
      <td><span class="planet-deg">${pos.deg}°</span></td>
      <td><span class="${statusClass}">${statusLabel}</span></td>
    `;
    tbody.appendChild(tr);
  });
}

/* ═══════════════════════════════════════════
   AI CONTENT GENERATION
═══════════════════════════════════════════ */
async function fetchAIContent(prompt, targetEl){
  targetEl.innerHTML = `<div class="ai-loading-inline"><div class="dot-anim"><span></span><span></span><span></span></div> Consulting the cosmic archives…</div>`;
  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await response.json();
    const text = data.content?.map(b=>b.text||'').join('') || 'The cosmic archives remain silent…';
    return text;
  } catch(e) {
    return 'The cosmic veil is thick tonight. Please try again.';
  }
}

function formatAIResponse(text){
  return text
    .split('\n\n')
    .filter(p=>p.trim())
    .map(p=>`<p>${p.replace(/\*\*(.*?)\*\*/g,'<span class="highlight">$1</span>').replace(/\*(.*?)\*/g,'<em>$1</em>')}</p>`)
    .join('');
}

Yogas present: ${data.yogas.map(y=>y.name).join(', ')}

Write in the style of an ancient, poetic Jyotishi speaking directly to the native. Use evocative metaphors, Vedic terminology, and deep insight. Be specific to the chart data given. 3-4 paragraphs.`;

  const prompts = {
    overview: base + `\n\nProvide: 1) A deep analysis of the Lagna (${data.lagnaSign}) and its esoteric meaning — the soul's chosen vehicle in this incarnation. 2) The profound soul purpose encoded in the ${data.moonNak} nakshatra — its deity, shakti, and karmic mission. 3) The three most dominant themes this soul has chosen to explore in this lifetime based on the chart.`,

    wealth: base + `\n\nAnalyze: 1) Wealth potential from the 2nd house (${SIGNS[(data.lagnaIdx+1)%12]}) and 11th house (${SIGNS[(data.lagnaIdx+10)%12]}). 2) Jupiter's blessings (${SIGNS[data.positions['Ju'].sign]}) and the timing of material abundance. 3) The native's unique Artha path — how their soul is designed to attract resources. 4) Most auspicious financial periods based on upcoming Dashas.`
  };

  // Fetch all content in parallel
  const [ov, ca, lo, he, we] = await Promise.all([

    fetchAIContent(prompts.career,   document.createElement('div')),

function getLagnaElement(lagnaIdx){
  const fire = {element:'Fire (Agni)', dosha:'Pitta — governs transformation, digestion, ambition', desc:'Dynamic, passionate, and driven. Energy burns bright; rest and cooling practices are essential.'};
  const earth = {element:'Earth (Prithvi)', dosha:'Kapha — governs stability, lubrication, endurance', desc:'Steady, sensual, and enduring. Prone to accumulation; movement and warmth catalyze vitality.'};
  const air = {element:'Air (Vayu)', dosha:'Vata — governs movement, creativity, nervous system', desc:'Quick, creative, and variable. Grounding routines, warm foods, and oil massages restore balance.'};
  const water = {element:'Water (Jala)', dosha:'Kapha-Pitta mix — emotional depth with fiery undertones', desc:'Fluid, intuitive, and deeply feeling. Emotional hygiene and heart-centered practices are vital.'};
  return [fire,earth,air,water,fire,earth,air,water,fire,earth,air,water][lagnaIdx] || air;
}

function buildGemCards(data){
  const recommendations = [];
  if(data.statuses['Su'] !== 'exalted') recommendations.push({gem:'Ruby',icon:'🔴',planet:'Sun',purpose:'Strengthens solar vitality, confidence, leadership'});
  if(data.statuses['Mo'] !== 'exalted') recommendations.push({gem:'Pearl',icon:'⚪',planet:'Moon',purpose:'Calms emotions, enhances intuition and sleep'});
  recommendations.push({gem:'Yellow Sapphire',icon:'💛',planet:'Jupiter',purpose:'Amplifies wisdom, prosperity, and divine grace'});
  if(data.statuses['Ve'] !== 'own') recommendations.push({gem:'Diamond',icon:'💎',planet:'Venus',purpose:'Enhances beauty, relationships, and creative gifts'});
  if(data.statuses['Sa'] !== 'own') recommendations.push({gem:'Blue Sapphire',icon:'💙',planet:'Saturn',purpose:'Discipline, karmic resolution, longevity — consult an astrologer first'});

  return recommendations.slice(0,4).map(r=>`
    <div class="gem-card">
      <div class="gem-icon">${r.icon}</div>
      <div class="gem-name">${r.gem}</div>
      <div class="gem-planet">${r.planet}</div>
      <div class="gem-purpose">${r.purpose}</div>
    </div>
  `).join('');
}

async function generateKundali(){
  const name = document.getElementById('inp-name').value || 'Seeker';
  const dob  = document.getElementById('inp-date').value || '1990-01-01';
  const tob  = document.getElementById('inp-time').value || '12:00';
  const place= document.getElementById('inp-place').value || 'Unknown';

  const btn = document.getElementById('generate-btn');
  btn.disabled = true;

  const overlay = document.getElementById('loading-overlay');
  overlay.classList.add('active');

  currentData = computeChart(name, dob, tob, place);

  renderChart(currentData);
  renderPlanetTable(currentData);

  document.getElementById('results').classList.add('active');
  document.getElementById('results').scrollIntoView({behavior:'smooth', block:'start'});

  await populateTabs(currentData);

  overlay.classList.remove('active');
  btn.disabled = false;
}
